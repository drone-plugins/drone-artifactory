pipeline:
  name: drone-artifactory-node-release
  identifier: droneartifactorynoderelease
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GitHub_Drone_Plugins_Org
        repoName: drone-artifactory
        build: <+input>
  variables:
    - name: expectedCommitSha
      type: String
      value: <+input>
  stages:
    - parallel:
        - stage:
            name: npm-linux-amd64
            identifier: npm_linux_amd64
            type: CI
            spec:
              cloneCodebase: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Build verified plugin binary
                      identifier: build_verified_plugin_binary
                      spec:
                        connectorRef: HHI_Public_Images
                        image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
                        shell: Sh
                        command: |
                          set -eu
                          test '<+codebase.commitSha>' = '<+pipeline.variables.expectedCommitSha>'
                          go test ./...
                          mkdir -p release/linux/amd64
                          if [ '<+codebase.build.type>' = tag ]; then
                            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags '-s -w -X main.version=<+codebase.tag> -X main.build=<+pipeline.sequenceId>' -o release/linux/amd64/plugin .
                          else
                            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags '-s -w -X main.build=<+pipeline.sequenceId>' -o release/linux/amd64/plugin .
                          fi
                  - step:
                      type: Plugin
                      name: Publish npm Node 18
                      identifier: publish_npm_node18
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: plugins/docker:21.3.0
                        settings:
                          pull_image: true
                          no_cache: true
                          base_image_registry: harness0.harness.io
                          base_image_username: <+secrets.getValue("harness0HARUsername")>
                          base_image_password: <+secrets.getValue("harness0HARPAT")>
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/artifactory
                          dockerfile: docker/Dockerfile.linux.node18.amd64
                          auto_tag: "true"
                          auto_tag_suffix: npm-linux-node18-amd64-r1
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Publish moving npm Node 18
                      identifier: publish_moving_npm_node18
                      spec:
                        envVariables:
                          PLUGIN_NO_CACHE: "true"
                          PLUGIN_PULL_IMAGE: "true"
                          PLUGIN_ENABLE_CACHE: "false"
                        baseImageConnectorRefs:
                          - HHI_Public_Images
                        connectorRef: Plugins_Docker_Hub_Connector
                        repo: plugins/artifactory
                        tags:
                          - npm-linux-node18-amd64
                        dockerfile: docker/Dockerfile.linux.node18.amd64
                        context: .
                        caching: false
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "branch"
                  - step:
                      type: Plugin
                      name: Publish npm Node 22
                      identifier: publish_npm_node22
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: plugins/docker:21.3.0
                        settings:
                          pull_image: true
                          no_cache: true
                          base_image_registry: harness0.harness.io
                          base_image_username: <+secrets.getValue("harness0HARUsername")>
                          base_image_password: <+secrets.getValue("harness0HARPAT")>
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/artifactory
                          dockerfile: docker/Dockerfile.linux.node22.amd64
                          auto_tag: "true"
                          auto_tag_suffix: npm-linux-node22-amd64-r1
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
